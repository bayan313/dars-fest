<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Admin | THANAFUS 2026</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { background: #f8fafc; }
    .admin-container { max-width: 1000px; margin: 40px auto; padding: 20px; }
  </style>
</head>
<body>

  <!-- AUTH OVERLAY -->
  <div class="modal-overlay active" id="auth-overlay">
    <div class="modal-card text-center" style="max-width: 420px;">
      <h2 style="font-size: 1.6rem; margin-bottom: 4px;">Quiz Master Login</h2>
      <p class="text-muted mb-4">Enter access key to manage Spot Quizzes</p>
      <form onsubmit="handleAdminLogin(event)">
        <input type="password" id="admin-pass" class="form-control mb-3" placeholder="Access Key..." required style="text-align:center; letter-spacing:2px; font-size:1.1rem; padding:12px;">
        <button type="submit" class="btn btn-gold w-100" style="padding:12px; font-size:1.1rem; font-weight:700;">Login to Quiz Control</button>
      </form>
    </div>
  </div>

  <!-- MAIN ADMIN -->
  <div class="admin-container" id="admin-panel-wrap" style="display: none;">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 style="font-size: 1.8rem; margin-bottom: 0;"><i class="fa-solid fa-stopwatch text-gold"></i> Spot Quiz Admin Panel</h2>
      <button class="btn btn-gold btn-lg" onclick="openQuizModal()"><i class="fa-solid fa-plus"></i> Create New Quiz</button>
    </div>

    <div class="card mb-4 shadow-sm border-0">
      <div class="table-responsive">
        <table class="table align-middle table-hover">
          <thead class="table-light">
            <tr>
              <th>Quiz Title</th>
              <th>Model</th>
              <th>Duration</th>
              <th>Status / Winner</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="quiz-table-body">
            <!-- Populated via JS -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Quiz Form Modal -->
  <div class="modal-overlay" id="quiz-form-modal">
    <div class="modal-card" style="max-width: 700px; max-height: 90vh; overflow-y: auto;">
      <div class="modal-header">
        <h3>Create Spot Quiz</h3>
        <button class="modal-close" onclick="closeQuizModal()">&times;</button>
      </div>
      <form onsubmit="saveQuizForm(event)">
        <div class="mb-3">
          <label>Quiz Title</label>
          <input type="text" id="qz-title" class="form-control" required placeholder="e.g. Stage 1 Live Quiz">
        </div>
        <div class="row mb-3">
          <div class="col-6">
            <label>Quiz Model</label>
            <select id="qz-model" class="form-select">
              <option value="model1">Model 1 (Single Q)</option>
              <option value="model2">Model 2 (Multi Q)</option>
            </select>
          </div>
          <div class="col-6">
            <label>Duration (Minutes)</label>
            <input type="number" id="qz-duration" class="form-control" value="10" required min="1">
          </div>
        </div>
        <hr>
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h5 class="mb-0">Questions</h5>
          <button type="button" class="btn btn-sm btn-outline-primary" onclick="addQuestionBlock()">+ Add Question</button>
        </div>
        <div id="qz-questions-wrap">
          <div class="quiz-q-block card p-3 mb-3 border-gold" style="background:#fcfcfc;">
            <h6>Question 1</h6>
            <input type="text" class="form-control mb-2 qz-q-text" placeholder="Question Text" required>
            <div class="row">
               <div class="col-6"><input type="text" class="form-control mb-2 qz-opt-a" placeholder="Option A" required></div>
               <div class="col-6"><input type="text" class="form-control mb-2 qz-opt-b" placeholder="Option B" required></div>
               <div class="col-6"><input type="text" class="form-control mb-2 qz-opt-c" placeholder="Option C"></div>
               <div class="col-6"><input type="text" class="form-control mb-2 qz-opt-d" placeholder="Option D"></div>
            </div>
            <input type="text" class="form-control mt-2 qz-ans border-success" placeholder="Exact Correct Answer Text" required>
          </div>
        </div>
        <div class="text-end mt-4">
          <button type="button" class="btn btn-outline" onclick="closeQuizModal()">Cancel</button>
          <button type="submit" class="btn btn-gold">Create & Start Quiz</button>
        </div>
      </form>
    </div>
  </div>

  <div id="alert-container" style="position: fixed; top: 20px; right: 20px; z-index: 9999;"></div>

  <script src="/js/db.js"></script>
  <script>
    const ThanafusDB = new Database();

    function showAlert(msg, type = 'info') {
      const el = document.createElement('div');
      el.className = \`alert alert-\${type} alert-dismissible fade show shadow-sm\`;
      el.innerHTML = \`\${msg} <button type="button" class="btn-close" data-bs-dismiss="alert"></button>\`;
      document.getElementById('alert-container').appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }

    function handleAdminLogin(e) {
      e.preventDefault();
      const pass = document.getElementById("admin-pass").value;
      if (ThanafusDB.verifyAdminPassword(pass)) {
        document.getElementById("auth-overlay").classList.remove("active");
        document.getElementById("admin-panel-wrap").style.display = "block";
        renderQuizAdmin();
      } else {
        showAlert("Invalid access key!", "danger");
      }
    }

    // Auto-login if session valid
    document.addEventListener("DOMContentLoaded", () => {
      ThanafusDB._loadPromise.then(() => {
        // Just require manual login for security
      });
    });

    window.addEventListener('thanafus:db-updated', () => {
      if (document.getElementById("admin-panel-wrap").style.display === "block") {
         renderQuizAdmin();
      }
    });

    function renderQuizAdmin() {
      const tbody = document.getElementById("quiz-table-body");
      if (!tbody) return;
      tbody.innerHTML = "";
      
      const quizzes = ThanafusDB.db.quizzes || [];
      if (quizzes.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4">No active quizzes found. Create one to start.</td></tr>';
        return;
      }

      quizzes.forEach(q => {
        const publicUrl = window.location.origin + "/quiz.html?id=" + q.id;
        const winnerText = q.winner ? \`<span class="badge bg-success">\${q.winner.name}</span>\` : (q.status === 'ended' ? '<span class="badge bg-secondary">No Winner</span>' : '<span class="badge bg-warning text-dark">Active</span>');
        
        tbody.innerHTML += \`
          <tr>
            <td><strong>\${q.title}</strong><br><small class="text-muted">\${q.questions.length} Questions</small></td>
            <td><span class="badge bg-light text-dark">\${q.model === 'model1' ? 'Model 1' : 'Model 2'}</span></td>
            <td>\${q.durationMins} Mins</td>
            <td>\${winnerText}</td>
            <td>
              <button class="btn btn-sm btn-outline-primary" onclick="copyQuizLink('\${publicUrl}')"><i class="fa-solid fa-link"></i> Copy Link</button>
              <button class="btn btn-sm btn-outline-danger ms-1" onclick="deleteQuiz('\${q.id}')"><i class="fa-solid fa-trash"></i></button>
            </td>
          </tr>
        \`;
      });
    }

    function copyQuizLink(url) {
      navigator.clipboard.writeText(url).then(() => showAlert("Quiz link copied! Paste it in QR Generator.", "success"));
    }

    function deleteQuiz(id) {
      if (confirm("Are you sure you want to delete this quiz? All responses will be lost.")) {
        ThanafusDB.deleteQuiz(id);
        renderQuizAdmin();
        showAlert("Quiz deleted.", "info");
      }
    }

    function openQuizModal() {
      document.getElementById("quiz-form-modal").classList.add("active");
    }

    function closeQuizModal() {
      document.getElementById("quiz-form-modal").classList.remove("active");
    }

    function saveQuizForm(e) {
      e.preventDefault();
      const title = document.getElementById("qz-title").value;
      const model = document.getElementById("qz-model").value;
      const duration = document.getElementById("qz-duration").value;
      
      const questions = [];
      const qBlocks = document.querySelectorAll(".quiz-q-block");
      qBlocks.forEach(block => {
         const qText = block.querySelector(".qz-q-text").value;
         const optA = block.querySelector(".qz-opt-a").value;
         const optB = block.querySelector(".qz-opt-b").value;
         const optC = block.querySelector(".qz-opt-c").value;
         const optD = block.querySelector(".qz-opt-d").value;
         const ans = block.querySelector(".qz-ans").value;
         
         if (qText && optA && ans) {
            questions.push({
               text: qText,
               options: [optA, optB, optC, optD].filter(x => x.trim() !== ""),
               answer: ans
            });
         }
      });

      if (questions.length === 0) {
         showAlert("Add at least one valid question with an answer.", "warning");
         return;
      }

      ThanafusDB.addQuiz(title, model, duration, questions);
      closeQuizModal();
      renderQuizAdmin();
      showAlert("Spot Quiz Created & Started!", "success");
    }

    function addQuestionBlock() {
       const wrap = document.getElementById("qz-questions-wrap");
       const idx = wrap.children.length + 1;
       const html = \`
         <div class="quiz-q-block card p-3 mb-3 border-gold" style="background:#fcfcfc;">
            <h6>Question \${idx}</h6>
            <input type="text" class="form-control mb-2 qz-q-text" placeholder="Question Text" required>
            <div class="row">
               <div class="col-6"><input type="text" class="form-control mb-2 qz-opt-a" placeholder="Option A" required></div>
               <div class="col-6"><input type="text" class="form-control mb-2 qz-opt-b" placeholder="Option B" required></div>
               <div class="col-6"><input type="text" class="form-control mb-2 qz-opt-c" placeholder="Option C"></div>
               <div class="col-6"><input type="text" class="form-control mb-2 qz-opt-d" placeholder="Option D"></div>
            </div>
            <input type="text" class="form-control mt-2 qz-ans border-success" placeholder="Exact Correct Answer Text" required>
         </div>
       \`;
       wrap.insertAdjacentHTML("beforeend", html);
    }
  </script>
</body>
</html>
